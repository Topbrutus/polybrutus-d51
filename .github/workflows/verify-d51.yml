name: Verify Polybrutus D51 exact science and Zenodo bibliography
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
jobs:
  exact-d51:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact rational arithmetic
        run: python -m pip install sympy==1.14.0
      - name: Primary exact rational metric and ideal graph
        run: python src/verify_d51.py
      - name: Independent Fraction labelled-distance reconstruction
        run: python tests/independent_d51.py
      - name: Deterministic certificate verification
        run: git diff --exit-code -- results/certificate_d51.json
      - name: Current Zenodo keywords, parent relation and bibliography
        run: python src/check_zenodo_metadata.py
